<!DOCTYPE html>
<html>
<head>
    <title>Portfolio</title>

    <style>

        body{
            font-family: Arial;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container{
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1{
            color: darkblue;
        }

        h2{
            color: green;
        }

        ul{
            line-height: 30px;
        }

        a{
            text-decoration: none;
            color: white;
            background: blue;
            padding: 10px 15px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>{{ name }}</h1>

    <p><b>Email:</b> {{ email }}</p>

    <p><b>Phone:</b> {{ phone }}</p>

    <h2>Professional Details</h2>

    <p>{{ profession }}</p>

    <p>{{ experience }}</p>

    <h2>Skills</h2>

    <ul>

        {% for skill in skills %}

            <li>{{ skill }}</li>

        {% endfor %}

    </ul>

    <h2>Projects</h2>

    <ul>

        {% for project in projects %}

            <li>{{ project }}</li>

        {% endfor %}

    </ul>

    <br>

    <a href="/contact/">Contact Me</a>

</div>

</body>
</html>
