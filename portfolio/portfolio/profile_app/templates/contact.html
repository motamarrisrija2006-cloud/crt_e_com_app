<!DOCTYPE html>
<html>
<head>

    <title>Contact Page</title>

    <style>

        body{
            font-family: Arial;
            background: #f2f2f2;
            margin: 40px;
        }

        .container{
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
        }

        input, textarea{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button{
            background: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        h1{
            color: darkblue;
        }

        .message{
            color: green;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Contact Form</h1>

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="name" placeholder="Enter Name" required>

        <input type="email" name="email" placeholder="Enter Email" required>

        <textarea name="message" rows="5" placeholder="Enter Message"></textarea>

        <button type="submit">Send</button>

    </form>

    <p class="message">{{ message }}</p>

    <br>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
