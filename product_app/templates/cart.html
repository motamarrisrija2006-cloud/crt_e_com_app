<!DOCTYPE html>
<html>
<head>

    <title>Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<h1 class="m-4">
    My Cart
</h1>

{% for i in cart_data %}

<div class="card m-4 p-3 shadow"
     style="width:350px;">

    <h2>{{ i.product.p_name }}</h2>

    <p>Type : {{ i.product.p_type }}</p>

    <p>Quantity : {{ i.product.p_quantity }}</p>

    <p>Price : {{ i.product.p_price }}</p>

</div>

{% endfor %}

</body>
</html>
