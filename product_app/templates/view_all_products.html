<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background-color: #f2f2f2;
        }

        .heading{
            margin-left: 30px;
            margin-top: 20px;
            font-size: 40px;
            font-weight: bold;
        }

        .product-card{
            width: 350px;
            margin: 20px 30px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .product-title{
            font-size: 35px;
            font-weight: bold;
        }

        .product-text{
            font-size: 20px;
        }

        .btn-space{
            margin-top: 10px;
        }

    </style>

</head>

<body>

<h1 class="heading">
    My Products
</h1>

{% for i in data %}

<div class="product-card">

    <h2 class="product-title">
        {{ i.p_name }}
    </h2>

    <p class="product-text">
        Type: {{ i.p_type }}
    </p>

    <p class="product-text">
        Quantity: {{ i.p_quantity }}
    </p>

    <p class="product-text">
        Price: {{ i.p_price }}
    </p>

    <!-- Delete Button -->

    <a href="/product/delete/{{ i.id }}/"
       class="btn btn-outline-dark">

        Delete Product

    </a>

    <br>

    <!-- Update Button -->

    <a href="/product/update/{{ i.id }}/"
       class="btn btn-primary btn-space">

        Update Item

    </a>

</div>

{% endfor %}

</body>
</html>
